name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows-program (bygning, tests, selvtest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Byg
        run: dotnet build windows/src/ImageShot/ImageShot.csproj -c Release -warnaserror:CS0108,CS0114

      - name: Enhedstests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet test windows/tests/ImageShot.Tests/ImageShot.Tests.csproj -c Release --logger "console;verbosity=normal" --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests 2>&1 | Tee-Object -FilePath artifacts/tests.log
          exit $LASTEXITCODE

      - name: Selvtest i det rigtige program
        shell: pwsh
        run: |
          $exe = "windows/src/ImageShot/bin/Release/net48/ImageShot.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest', "$PWD/artifacts/selftest" -PassThru -Wait
          Get-Content artifacts/selftest/report.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { Write-Error "Selvtesten fejlede ($($p.ExitCode))"; exit 1 }

      - name: Pak installationsprogram, bærbar zip og udvidelse
        shell: pwsh
        run: |
          $ver = (Select-Xml -Path windows/src/ImageShot/ImageShot.csproj -XPath '//Version').Node.InnerText
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pwsh build/package.ps1 -Version $ver *>&1 | Tee-Object -FilePath artifacts/package.log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path artifacts/release/*.exe)) { exit 1 }

      - name: Test installation og afinstallation
        shell: pwsh
        run: |
          $setup = (Get-ChildItem artifacts/release/ImageShot-Setup-*.exe).FullName
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ImageShot'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=autostart', '/LOG=artifacts\install.log' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installation fejlede ($($p.ExitCode))" }
          if (-not (Test-Path "$dir\ImageShot.exe")) { throw "ImageShot.exe blev ikke installeret" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ImageShot.lnk")) { throw "Genvej i Start mangler" }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name ImageShot -ErrorAction SilentlyContinue
          if (-not $run) { throw "Autostart blev ikke sat" }
          Get-Process ImageShot -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -PassThru -Wait
          Start-Sleep 3
          if (Test-Path "$dir\ImageShot.exe") { throw "Afinstallation efterlod ImageShot.exe" }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name ImageShot -ErrorAction SilentlyContinue
          if ($run) { throw "Autostart blev ikke fjernet ved afinstallation" }
          "Installation og afinstallation OK" | Tee-Object -FilePath artifacts/install-test.txt

      - name: Del byggede filer (gren ci-build)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          d="$RUNNER_TEMP/build"; mkdir -p "$d"; cp artifacts/release/* "$d"/
          cd "$d" && git init -q && git checkout -q -b ci-build && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-build

      - name: Fejllog fra selvtesten
        if: always()
        shell: pwsh
        run: |
          $d = Join-Path $env:APPDATA "ImageShot\logs"
          if (Test-Path $d) { Copy-Item $d artifacts/logs -Recurse; Get-ChildItem $d | ForEach-Object { Get-Content $_.FullName -Encoding utf8 } }

      # Resultaterne skrives også som annoteringer, så de kan læses via GitHubs API.
      - name: Rapportér resultater som annoteringer
        if: always()
        shell: pwsh
        run: |
          function Annotate($level, $title, $file) {
            if (-not (Test-Path $file)) { return }
            $t = (Get-Content $file -Encoding utf8 | Select-Object -Last 220) -join "`n"
            $t = $t.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::$level title=$title::$t"
          }
          $failedTests = (Test-Path artifacts/tests.log) -and (Select-String -Path artifacts/tests.log -Pattern 'Failed!|Mislykkedes|error' -Quiet)
          Annotate ($(if ($failedTests) { 'error' } else { 'notice' })) 'Enhedstests' artifacts/tests.log
          Annotate 'notice' 'Selvtest' artifacts/selftest/report.txt
          Annotate 'notice' 'Pakning' artifacts/package.log
          Annotate 'notice' 'Installationstest' artifacts/install-test.txt
          Get-ChildItem artifacts/logs -ErrorAction SilentlyContinue | ForEach-Object { Annotate 'notice' ('Log ' + $_.Name) $_.FullName }

      - name: Del skærmbilleder (gren ci-shots-windows)
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/shots"; mkdir -p "$d"
          cp artifacts/selftest/ui/*.png artifacts/selftest/*.png "$d"/ 2>/dev/null || true
          cd "$d" && git init -q && git checkout -q -b ci-shots-windows && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "skærmbilleder ${{ github.sha }}" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots-windows

      - name: Gem resultater
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.sha }}
          path: |
            artifacts/
            windows/src/ImageShot/bin/Release/net48/

  extension:
    name: Browserudvidelse (Chromium-tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installér Playwright og Xvfb
        working-directory: extension/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb libxtst6
      - name: Kør tests
        working-directory: extension/tests
        env:
          TEST_OUT: ${{ github.workspace }}/extension/tests/out
        run: |
          mkdir -p out
          set -o pipefail
          bash ./run-all.sh 2>&1 | tee out/run-all.log
      - name: Rapportér resultater som annoteringer
        if: always()
        working-directory: extension/tests
        run: |
          if [ -f out/run-all.log ]; then
            msg=$(tail -n 200 out/run-all.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            if grep -qE "^FAIL|^FAILED:" out/run-all.log; then lvl=error; else lvl=notice; fi
            echo "::$lvl title=Udvidelsestests::$msg"
          fi
      - name: Del skærmbilleder (gren ci-shots-extension)
        if: always()
        run: |
          d="$RUNNER_TEMP/shots"; mkdir -p "$d"
          find extension/tests/out -name '*.png' -exec cp {} "$d"/ \; 2>/dev/null || true
          cd "$d" && git init -q && git checkout -q -b ci-shots-extension && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "skærmbilleder ${{ github.sha }}" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots-extension

      - name: Gem resultater
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: extension/tests/out/
          if-no-files-found: ignore
